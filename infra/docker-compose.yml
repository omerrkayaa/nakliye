name: nakliye

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nakliye
      POSTGRES_PASSWORD: nakliye
      POSTGRES_DB: nakliye
    ports:
      - "5432:5432"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakliye"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nakliye
      MINIO_ROOT_PASSWORD: nakliye123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  # F7 karayolu mesafesi (OSRM, OpenStreetMap verisi; ücretsiz, kendi makinemizde). Veri bir kez hazırlanır: osrm.md
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/turkey.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    restart: unless-stopped
